<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | CENATRA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-logo">
            <img src="Imagenes/logo.png" alt="Logo CENATRA">
        </div>
        
        <h2>Acceso al Acervo</h2>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="username">Usuario o Correo Electrónico</label>
                <input type="text" id="username" name="username" placeholder="ejemplo@salud.gob.mx" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
        
        <a href="index.html" class="back-to-home">← Volver al Inicio</a>
    </div>

</body>
</html>
